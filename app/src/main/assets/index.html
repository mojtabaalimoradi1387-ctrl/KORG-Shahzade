<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KORG Shahzade</title>

<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#101114;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
  user-select:none;
}
.app {
  height:100dvh;
  min-height:300px;
  display:flex;
  flex-direction:column;
  padding:8px;
  gap:7px;
}
.header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#202126;
  border:1px solid #444;
  border-radius:9px;
  padding:8px 13px;
}
.logo {
  color:#ff2929;
  font-size:22px;
  font-weight:bold;
  letter-spacing:1px;
}
.subtitle { color:#aaa;font-size:10px; }
.screen {
  background:linear-gradient(135deg,#17242a,#263b40);
  border:2px solid #555;
  border-radius:9px;
  padding:9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:65px;
}
.screen strong {color:#7dffbb;font-size:17px;}
.screen small {color:#c7d5d5;}
.controls {
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:5px;
}
button,select {
  border:1px solid #555;
  border-radius:6px;
  background:#292a30;
  color:white;
  padding:9px 3px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  min-width:0;
}
button:active,.active {
  background:#b51e25;
  border-color:#ff5757;
}
.red {background:#a91c23;}
.gold {background:#70531c;}
.settings {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  background:#202126;
  padding:7px;
  border-radius:8px;
}
.settings label {font-size:11px;color:#ddd;}
select {padding:7px;max-width:115px;}
input[type=range] {width:75px;accent-color:#e52a32;}
.keyboard {
  flex:1;
  min-height:100px;
  display:flex;
  gap:3px;
  padding:5px;
  background:#090909;
  border:2px solid #555;
  border-radius:9px;
  overflow:hidden;
}
.key {
  flex:1;
  border-radius:0 0 6px 6px;
  background:linear-gradient(#fff,#d8d8d8);
  color:#111;
  border:1px solid #aaa;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:7px;
  font-size:10px;
  touch-action:none;
}
.key.black {
  background:linear-gradient(#555,#111);
  color:white;
  border-color:#000;
}
.key.playing {
  background:#ff4545;
  color:white;
}
.footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#aaa;
  font-size:10px;
  padding:2px 5px;
}
@media (orientation:portrait) {
  .app {min-height:100dvh;height:auto;overflow:auto;}
  .keyboard {height:170px;flex:none;}
  .controls {grid-template-columns:repeat(4,minmax(0,1fr));}
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div>
      <div class="logo">KORG SHAHZADE</div>
      <div class="subtitle">DIGITAL MUSIC WORKSTATION</div>
    </div>
    <div style="text-align:left">
      <div style="color:#7dffbb;font-size:12px">READY</div>
      <small>Pa5X inspired</small>
    </div>
  </div>

  <div class="screen">
    <div>
      <small>SELECTED SOUND</small><br>
      <strong id="soundName">Grand Piano</strong>
    </div>
    <div style="text-align:center">
      <small>STYLE / RHYTHM</small><br>
      <strong id="styleName">POP</strong>
    </div>
    <div style="text-align:left">
      <small>TEMPO</small><br>
      <strong id="tempoValue">120 BPM</strong>
    </div>
  </div>

  <div class="controls">
    <button onclick="selectSound()">SOUND</button>
    <button onclick="selectStyle()">STYLE</button>
    <button class="red" onclick="toggleRhythm()" id="startBtn">START</button>
    <button onclick="changeTempo(-5)">TEMPO -</button>
    <button onclick="changeTempo(5)">TEMPO +</button>
    <button onclick="changeOctave(-1)">OCTAVE -</button>
    <button onclick="changeOctave(1)">OCTAVE +</button>
    <button onclick="toggleSplit()" id="splitBtn">SPLIT</button>

    <button onclick="showMessage('INTRO فعال شد')">INTRO</button>
    <button onclick="showMessage('FILL فعال شد')">FILL</button>
    <button onclick="showMessage('VARIATION فعال شد')">VARIATION</button>
    <button onclick="showMessage('ENDING فعال شد')">ENDING</button>
    <button onclick="toggleRecord()" id="recordBtn">RECORD</button>
    <button onclick="playRecording()">PLAY REC</button>
    <button onclick="clearRecording()">CLEAR</button>
    <button onclick="showMessage('تنظیمات آماده است')">MENU</button>
  </div>

  <div class="settings">
    <label>تعداد کلید:</label>
    <select id="keyCount" onchange="renderKeys()">
      <option value="7">۷ کلید</option>
      <option value="8">۸ کلید</option>
      <option value="9">۹ کلید</option>
      <option value="14">۱۴ کلید</option>
      <option value="21" selected>۲۱ کلید</option>
    </select>

    <label>صدا:</label>
    <select id="soundSelect" onchange="updateSound()">
      <option value="piano">Piano</option>
      <option value="organ">Organ</option>
      <option value="strings">Strings</option>
      <option value="bass">Bass</option>
      <option value="synth">Synth</option>
    </select>

    <label>VOL</label>
    <input type="range" min="0" max="100" value="70"
      id="volume" oninput="updateVolume()">
  </div>

  <div class="keyboard" id="keyboard"></div>

  <div class="footer">
    <span id="status">KORG Shahzade آماده اجرا</span>
    <span id="octaveLabel">OCTAVE: 4</span>
  </div>

</div>

<script>
let audio = null;
let volume = 0.7;
let tempo = 120;
let octave = 4;
let sound = "piano";
let style = 0;
let rhythmTimer = null;
let rhythmOn = false;
let splitOn = false;
let recording = false;
let recordStart = 0;
let recordedNotes = [];

const styles = ["POP","ROCK","BALLAD","DANCE","WALTZ"];

function initAudio() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audio.state === "suspended") audio.resume();
}

function showMessage(message) {
  document.getElementById("status").textContent = message;
}

function renderKeys() {
  const count = Number(document.getElementById("keyCount").value);
  const keyboard = document.getElementById("keyboard");
  keyboard.innerHTML = "";

  for (let i = 0; i < count; i++) {
    const note = i % 12;
    const black = [1,3,6,8,10].includes(note);
    const key = document.createElement("button");
    key.className = "key" + (black ? " black" : "");
    key.textContent = ["C","C#","D","D#","E","F",
                       "F#","G","G#","A","A#","B"][note];

    key.addEventListener("pointerdown", e => {
      e.preventDefault();
      key.classList.add("playing");
      playNote(i);
    });

    const release = () => key.classList.remove("playing");
    key.addEventListener("pointerup", release);
    key.addEventListener("pointerleave", release);
    key.addEventListener("pointercancel", release);

    keyboard.appendChild(key);
  }
}

function playNote(index, shouldRecord = true) {
  initAudio();

  const midi = 60 + (octave - 4) * 12 + index;
  const frequency = 440 * Math.pow(2,(midi - 69) / 12);

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  const waveforms = {
    piano:"triangle",
    organ:"sine",
    strings:"sawtooth",
    bass:"triangle",
    synth:"square"
  };

  osc.type = waveforms[sound] || "triangle";
  osc.frequency.value = frequency;

  gain.gain.setValueAtTime(volume * 0.23,audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001,audio.currentTime + 1.2
  );

  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime + 1.2);

  if (recording && shouldRecord) {
    recordedNotes.push({
      note:index,
      time:Date.now()-recordStart
    });
  }

  showMessage("Playing note " + (index + 1));
}

function updateSound() {
  sound = document.getElementById("soundSelect").value;
  const names = {
    piano:"Grand Piano",
    organ:"Organ",
    strings:"Strings",
    bass:"Bass",
    synth:"Synth"
  };
  document.getElementById("soundName").textContent = names[sound];
  showMessage("Sound changed: " + names[sound]);
}

function updateVolume() {
  volume = Number(document.getElementById("volume").value) / 100;
}

function changeTempo(amount) {
  tempo = Math.max(40,Math.min(240,tempo+amount));
  document.getElementById("tempoValue").textContent = tempo+" BPM";
  if (rhythmOn) startRhythm();
}

function changeOctave(amount) {
  octave = Math.max(1,Math.min(7,octave+amount));
  document.getElementById("octaveLabel").textContent =
    "OCTAVE: "+octave;
}

function selectSound() {
  const select = document.getElementById("soundSelect");
  select.selectedIndex = (select.selectedIndex+1)%select.options.length;
  updateSound();
}

function selectStyle() {
  style = (style+1)%styles.length;
  document.getElementById("styleName").textContent = styles[style];
  showMessage("Style: "+styles[style]);
}

function toggleSplit() {
  splitOn = !splitOn;
  document.getElementById("splitBtn").classList.toggle("active",splitOn);
  showMessage(splitOn ? "Split enabled" : "Split disabled");
}

function startRhythm() {
  clearInterval(rhythmTimer);
  const beat = 60000/tempo;
  rhythmTimer = setInterval(() => {
    initAudio();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.frequency.value = 800;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime+0.04);
  },beat);
}

function toggleRhythm() {
  if (!rhythmOn) {
    initAudio();
    rhythmOn = true;
    startRhythm();
    document.getElementById("startBtn").textContent = "STOP";
    showMessage("Metronome running");
  } else {
    rhythmOn = false;
    clearInterval(rhythmTimer);
    document.getElementById("startBtn").textContent = "START";
    showMessage("Rhythm stopped");
  }
}

function toggleRecord() {
  if (!recording) {
    recordedNotes = [];
    recording = true;
    recordStart = Date.now();
    document.getElementById("recordBtn").classList.add("active");
    showMessage("Recording started");
  } else {
    recording = false;
    document.getElementById("recordBtn").classList.remove("active");
    showMessage("Recording saved in this session");
  }
}

function playRecording() {
  if (!recordedNotes.length) {
    showMessage("No recording available");
    return;
  }
  recordedNotes.forEach(item => {
    setTimeout(() => playNote(item.note,false),item.time);
  });
  showMessage("Playing recording");
}

function clearRecording() {
  recordedNotes = [];
  recording = false;
  document.getElementById("recordBtn").classList.remove("active");
  showMessage("Recording cleared");
}

renderKeys();
</script>
</body>
</html>
