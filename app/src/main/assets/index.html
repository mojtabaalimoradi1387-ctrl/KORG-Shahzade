<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORG Shahzade</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    background: #101014;
    color: white;
}

header {
    background: #191923;
    padding: 25px 15px;
    text-align: center;
    border-bottom: 2px solid #d4a947;
}

header h1 {
    color: #e4bd62;
    margin: 0;
}

header p {
    color: #aaa;
}

.container {
    padding: 20px;
}

.card {
    background: #20202b;
    border: 1px solid #393947;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
}

.card h2 {
    color: #e4bd62;
}

button {
    width: 100%;
    padding: 14px;
    background: #d4a947;
    color: #171717;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>KORG Shahzade</h1>
    <p>دنیای موسیقی با شاهزاده</p>
</header>

<div class="container">

    <div class="card">
        <h2>خوش آمدید</h2>
        <p>به اپلیکیشن KORG Shahzade خوش آمدید.</p>
    </div>

    <div class="card">
        <h2>آموزش کیبورد</h2>
        <p>آموزش و مطالب مربوط به کیبورد کورگ.</p>
        <button onclick="alert('به زودی')">ورود</button>
    </div>

    <div class="card">
        <h2>فایل‌های موسیقی</h2>
        <p>بخش فایل‌ها و منابع موسیقی.</p>
        <button onclick="alert('به زودی')">مشاهده</button>
    </div>

    <div class="card">
        <h2>ارتباط با ما</h2>
        <p>KORG Shahzade</p>
    </div>

</div>

</body>
</html>
