
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORG Shahzade</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#10131c;
 color:white;
 font-family:Tahoma,Arial;
 text-align:center;
}
header{
 padding:22px 10px;
 background:linear-gradient(135deg,#252b40,#111522);
 border-bottom:2px solid #d6a943;
}
h1{color:#f3c75b;margin:5px}
.subtitle{color:#aaa;font-size:12px}
.panel{
 margin:15px;
 padding:15px;
 background:#202638;
 border-radius:15px;
}
select,button{
 padding:12px;
 margin:5px;
 border:0;
 border-radius:9px;
 font-size:14px;
}
select{background:#eee;color:#111}
button{
 background:#d5a73c;
 color:#171717;
 font-weight:bold;
}
button:active{background:#fff}
.controls{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 align-items:center;
}
label{font-size:13px;color:#ddd}
input{accent-color:#e9b94b}
.keyboard{
 direction:ltr;
 display:flex;
 justify-content:center;
 position:relative;
 height:190px;
 margin:20px 8px;
}
.white{
 flex:1;
 max-width:55px;
 background:#fff;
 border:1px solid #222;
 border-radius:0 0 7px 7px;
 height:180px;
 color:#222;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 padding-bottom:12px;
 font-size:10px;
 z-index:1;
 touch-action:none;
}
.black{
 position:absolute;
 top:0;
 width:5.5%;
 max-width:34px;
 height:112px;
 background:linear-gradient(#444,#050505);
 border:1px solid #777;
 border-radius:0 0 6px 6px;
 z-index:2;
 touch-action:none;
}
.white.active{background:#eac65d}
.black.active{background:#b78a28}
.small{font-size:12px;color:#aaa}
footer{padding:20px;color:#888;font-size:12px}
</style>
</head>

<body>

<header>
<h1>♬ KORG SHAHZADE</h1>
<div class="subtitle">ارگ دیجیتال شاهزاده</div>
</header>

<div class="panel">
<h3>انتخاب صدای ساز</h3>
<select id="instrument">
<option value="piano">پیانو</option>
<option value="santur">سنتور</option>
<option value="tar">تار</option>
<option value="ney">نی</option>
</select>
</div>

<div class="panel">
<h3>ریتم دستگاه</h3>
<select id="rhythm">
<option value="pop">پاپ</option>
<option value="six">شش و هشت</option>
<option value="bandari">بندری</option>
<option value="slow">آرام</option>
</select>

<div class="controls">
<button id="play">▶ شروع ریتم</button>
<button id="stop">■ توقف</button>
</div>

<p>سرعت ریتم: <span id="bpmText">110</span></p>
<input id="bpm" type="range" min="60" max="180" value="110">

<p>صدای ریتم</p>
<input id="volume" type="range" min="0" max="100" value="65">
</div>

<div class="panel">
<h3>صفحه کلید دو اکتاو</h3>
<p class="small">برای نواختن روی کلاویه‌ها ضربه بزن</p>
<div class="keyboard" id="keyboard"></div>
</div>

<footer>
KORG SHAHZADE<br>
Digital Musical Instrument
</footer>

<script>
let audio;
let master;
let rhythmTimer=null;
let beat=0;

function initAudio(){
 if(!audio){
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain();
  master.gain.value=.35;
  master.connect(audio.destination);
 }
 if(audio.state==="suspended") audio.resume();
}

const notes=[
"C","C#","D","D#","E","F",
"F#","G","G#","A","A#","B"
];

const blackPositions=[0,1,0,1,0,0,1,0,1,0,1,0];

function frequency(n){
 return 261.63*Math.pow(2,n/12);
}

function playNote(n){
 initAudio();
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 const type=document.getElementById("instrument").value;

 const wave={
 piano:"triangle",
 santur:"sine",
 tar:"sawtooth",
 ney:"sine"
 };

 osc.type=wave[type];
 osc.frequency.value=frequency(n);

 if(type==="tar") osc.detune.value=-8;

 gain.gain.setValueAtTime(.0001,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(
 .35,audio.currentTime+.015
 );
 gain.gain.exponentialRampToValueAtTime(
 .001,audio.currentTime+(type==="ney"?.7:.9)
 );

 osc.connect(gain);
 gain.connect(master);

 osc.start();
 osc.stop(audio.currentTime+1);
}

const keyboard=document.getElementById("keyboard");

for(let i=0;i<24;i++){
 if(blackPositions[i%12]===0){
  const key=document.createElement("div");
  key.className="white";
  key.textContent=notes[i%12];
  key.addEventListener("pointerdown",e=>{
   e.preventDefault();
   key.classList.add("active");
   playNote(i);
  });
  key.addEventListener("pointerup",()=>{
   key.classList.remove("active");
  });
  key.addEventListener("pointerleave",()=>{
   key.classList.remove("active");
  });
  keyboard.appendChild(key);
 }
}

const whites=[...keyboard.children];
let whiteIndex=0;

for(let i=0;i<24;i++){
 if(blackPositions[i%12]===1){
  const key=document.createElement("div");
  key.className="black";
  key.style.left=
   ((whiteIndex/14)*100-2.5)+"%";
  key.addEventListener("pointerdown",e=>{
   e.preventDefault();
   key.classList.add("active");
   playNote(i);
  });
  key.addEventListener("pointerup",()=>{
   key.classList.remove("active");
  });
  key.addEventListener("pointerleave",()=>{
   key.classList.remove("active");
  });
  keyboard.appendChild(key);
 }else{
  whiteIndex++;
 }
}

function drum(freq,duration,volume){
 initAudio();
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type="sine";
 osc.frequency.setValueAtTime(freq,audio.currentTime);
 osc.frequency.exponentialRampToValueAtTime(
  35,audio.currentTime+duration
 );
 gain.gain.setValueAtTime(volume,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(
  .001,audio.currentTime+duration
 );
 osc.connect(gain);
 gain.connect(master);
 osc.start();
 osc.stop(audio.currentTime+duration);
}

function tick(){
 const mode=document.getElementById("rhythm").value;
 const vol=Number(document.getElementById("volume").value)/100;
 if(mode==="six"){
  if(beat%6===0) drum(110,.22,vol*.8);
  if(beat%6===3) drum(170,.12,vol*.5);
 }else if(mode==="bandari"){
  if(beat%4===0) drum(100,.2,vol);
  if(beat%4===2) drum(180,.12,vol*.6);
 }else if(mode==="slow"){
  if(beat%4===0) drum(100,.3,vol);
 }else{
  if(beat%4===0) drum(100,.2,vol);
  if(beat%4===2) drum(170,.12,vol*.5);
 }
 beat++;
}

function startRhythm(){
 initAudio();
 stopRhythm();
 beat=0;
 const bpm=Number(document.getElementById("bpm").value);
 rhythmTimer=setInterval(tick,60000/bpm);
 tick();
}

function stopRhythm(){
 if(rhythmTimer){
  clearInterval(rhythmTimer);
  rhythmTimer=null;
 }
}

document.getElementById("play").onclick=startRhythm;
document.getElementById("stop").onclick=stopRhythm;

document.getElementById("bpm").oninput=function(){
 document.getElementById("bpmText").textContent=this.value;
 if(rhythmTimer) startRhythm();
};
</script>

</body>
</html>
